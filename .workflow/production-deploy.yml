version: '1.0'
name: production-deploy
displayName: ProductionDeploy
triggers:
  trigger: manual
  push:
    branches:
      precise:
        - main
stages:
  - name: build_and_deploy
    displayName: 构建并发布
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@maven
        name: build_backend
        displayName: 构建后端
        jdkVersion: '21'
        mavenVersion: 3.9.11
        commands:
          - cd backend
          - mvn -B -ntp test
          - mvn -B -ntp -DskipTests package
        artifacts:
          - name: BACKEND_ARTIFACT
            path:
              - backend/target/store-profit-backend-0.1.0-SNAPSHOT.jar
        settings: []
        caches:
          - ~/.m2
        notify: []
        strategy:
          retry: '0'
      - step: build@nodejs
        name: build_frontend
        displayName: 构建前端
        nodeVersion: 22.22.0
        commands:
          - cd frontend-vue
          - npm ci
          - npm run build
        artifacts:
          - name: FRONTEND_ARTIFACT
            path:
              - frontend-vue/dist
        caches:
          - ~/.npm
          - ~/.yarn
        notify: []
        strategy:
          retry: '0'
  - name: deploy_production
    displayName: 发布到生产服务器
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: deploy@agent
        name: deploy_agent
        displayName: 主机部署
        hostGroupID:
          ID: store-profit-production
          hostID:
            - 8f89dcbb-5d38-493a-b51c-54caddba7985
        deployArtifact:
          - source: build
            name: backend_release
            target: ~/gitee_go/deploy
            dependArtifact: BACKEND_ARTIFACT
          - name: frontend_release
            target: ~/gitee_go/deploy
            source: build
            dependArtifact: FRONTEND_ARTIFACT
        script:
          - set -Eeuo pipefail
          - ''
          - deploy_dir="/home/deploy/gitee_go/deploy"
          - release_id="gitee-$(date -u +%Y%m%d%H%M%S)-${RANDOM}${RANDOM}"
          - release_dir="/home/deploy/releases/$release_id"
          - ''
          - test -f "$deploy_dir/backend_release"
          - test -f "$deploy_dir/frontend_release"
          - ''
          - tar -tzf "$deploy_dir/backend_release" >/dev/null
          - tar -tzf "$deploy_dir/frontend_release" >/dev/null
          - ''
          - install -d -m 0700 "$release_dir"
          - install -m 0600 "$deploy_dir/backend_release" "$release_dir/backend-release.tar.gz"
          - install -m 0600 "$deploy_dir/frontend_release" "$release_dir/frontend-release.tar.gz"
          - ''
          - sudo -n /usr/local/sbin/store-profit-release "$release_id"
        notify: []
        strategy:
          retry: '0'
