name: ai-profit-os-production

services:
  gateway:
    image: ${GATEWAY_IMAGE_REPOSITORY:?Set GATEWAY_IMAGE_REPOSITORY}:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_BIND_IP:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ${SSL_DIRECTORY:?Set SSL_DIRECTORY in .env.production}:/etc/nginx/ssl:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: ${FRONTEND_IMAGE_REPOSITORY:?Set FRONTEND_IMAGE_REPOSITORY}:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE_REPOSITORY:?Set BACKEND_IMAGE_REPOSITORY}:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:?Set ENV_FILE}
    environment:
      SERVER_PORT: 8080
      APP_EXPENSE_SUPPLEMENT_STORAGE_ROOT: /app/expense-supplements
      INSPECTION_INTERNAL_SERVICE_ENABLED: ${INSPECTION_INTERNAL_SERVICE_ENABLED:-false}
    volumes:
      - backend-expense-supplements:/app/expense-supplements
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  inspection-service:
    profiles: ["inspection"]
    image: ${INSPECTION_IMAGE_REPOSITORY:?Set INSPECTION_IMAGE_REPOSITORY}:${APP_IMAGE_TAG:?Set APP_IMAGE_TAG}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      YOLO_CONFIG_DIR: /tmp/Ultralytics
    volumes:
      - inspection-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  backend-expense-supplements:
  inspection-data:
