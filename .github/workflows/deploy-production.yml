name: Deploy production

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Commit, tag, or branch to deploy"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build immutable images and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout approved ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Resolve immutable revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package backend
        working-directory: backend
        run: mvn -B -ntp -DskipTests package

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Build frontend
        working-directory: frontend-vue
        run: npm ci && npm run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable images
        env:
          IMAGE_TAG: sha-${{ steps.revision.outputs.sha }}
          IMAGE_OWNER: ${{ github.repository_owner }}
        run: |
          docker build --pull -t "ghcr.io/$IMAGE_OWNER/ai-profit-os-gateway:$IMAGE_TAG" deploy
          docker build --pull -t "ghcr.io/$IMAGE_OWNER/ai-profit-os-backend:$IMAGE_TAG" backend
          docker build --pull -t "ghcr.io/$IMAGE_OWNER/ai-profit-os-frontend:$IMAGE_TAG" frontend-vue
          docker build --pull -t "ghcr.io/$IMAGE_OWNER/ai-profit-os-inspection:$IMAGE_TAG" inspection-service
          docker push "ghcr.io/$IMAGE_OWNER/ai-profit-os-gateway:$IMAGE_TAG"
          docker push "ghcr.io/$IMAGE_OWNER/ai-profit-os-backend:$IMAGE_TAG"
          docker push "ghcr.io/$IMAGE_OWNER/ai-profit-os-frontend:$IMAGE_TAG"
          docker push "ghcr.io/$IMAGE_OWNER/ai-profit-os-inspection:$IMAGE_TAG"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Run the single-command server deployment
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_DIRECTORY: ${{ vars.DEPLOY_DIRECTORY }}
          IMAGE_TAG: sha-${{ steps.revision.outputs.sha }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '${DEPLOY_DIRECTORY:-/opt/ai-profit-os}' && APP_IMAGE_TAG='$IMAGE_TAG' ./deploy/production-update.sh"
